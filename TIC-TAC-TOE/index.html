<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe vs AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Tic-Tac-Toe vs AI</h1>
    <div id="status"></div>
    <div id="score"></div>
    <div id="board"></div>

    <div class="buttons">
      <button id="restart">New Game</button>
      <button id="clear" class="secondary">Clear Data</button>
    </div>

    <h2>Recent Games</h2>
    <ul id="history"></ul>
  </main>

  <!-- database.js must load BEFORE script.js because script.js uses it -->
  <script src="database.js"></script>
  <script src="script.js"></script>
</body>
</html>
